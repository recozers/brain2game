<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coherent Flow Runner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #0d1424;
      border-bottom: 1px solid #1e293b;
      padding: 8px 16px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #0284c7;
      color: #7dd3fc;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-variant-numeric: tabular-nums;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .stat-val {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.1;
    }
    .stat-val.timer {
      color: #38bdf8;
    }
    .stat-val.score {
      color: #34d399;
    }
    .why-text {
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.35;
    }
    #canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0e172a 0%, #060911 100%);
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header id="game-header">
    <div class="header-top">
      <div class="title-group">
        <h1>Coherent Flow Runner</h1>
        <span class="badge">Target: Visual motion (MT+/V5)</span>
      </div>
      <div class="stats">
        <div class="stat-box">
          <span class="stat-label">Time Remaining</span>
          <span class="stat-val timer" id="ui-timer">60.0s</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Score</span>
          <span class="stat-val score" id="ui-score">0</span>
        </div>
      </div>
    </div>
    <p class="why-text">Because the camera was held steady with little movement or optic flow, the simulated average brain's visual motion network ranked lowest among all systems (mean z = 0.15).</p>
  </header>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

<script>
(function() {
  'use strict';

  // --- Audio Synth (Lazy initialized on first interaction) ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function playTone(freq, duration, type = 'sine', decay = true) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      if (decay) {
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      }
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function soundSuccess(combo) {
    const baseFreq = 440 + Math.min(combo * 45, 600);
    playTone(baseFreq, 0.12, 'sine');
    setTimeout(() => playTone(baseFreq * 1.25, 0.16, 'triangle'), 60);
  }

  function soundFail() {
    playTone(180, 0.22, 'sawtooth');
    setTimeout(() => playTone(120, 0.25, 'sawtooth'), 80);
  }

  // --- Direction Constants (0: Right, 1: Down, 2: Left, 3: Up) ---
  const DIRS = [
    { id: 0, name: 'RIGHT', dx: 1,  dy: 0,  angle: 0,            keys: ['ArrowRight', 'KeyD'] },
    { id: 1, name: 'DOWN',  dx: 0,  dy: 1,  angle: Math.PI / 2,  keys: ['ArrowDown',  'KeyS'] },
    { id: 2, name: 'LEFT',  dx: -1, dy: 0,  angle: Math.PI,      keys: ['ArrowLeft',  'KeyA'] },
    { id: 3, name: 'UP',    dx: 0,  dy: -1, angle: -Math.PI / 2, keys: ['ArrowUp',    'KeyW'] }
  ];

  // --- Canvas Setup ---
  const container = document.getElementById('canvas-container');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const uiTimer = document.getElementById('ui-timer');
  const uiScore = document.getElementById('ui-score');

  let width = 800;
  let height = 600;
  let dpr = window.devicePixelRatio || 1;
  let centerX = width / 2;
  let centerY = height / 2;
  let apertureRadius = 210;

  function resize() {
    if (!container || !canvas) return;
    width = container.clientWidth;
    height = container.clientHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.resetTransform && ctx.resetTransform();
    ctx.scale(dpr, dpr);

    centerX = width / 2;
    centerY = height / 2;
    apertureRadius = Math.max(140, Math.min(width, height) * 0.32);
  }
  window.addEventListener('resize', resize);

  // --- Game State Variables ---
  const STATE_START = 'START';
  const STATE_PLAYING = 'PLAYING';
  const STATE_GAMEOVER = 'GAMEOVER';

  let gameState = STATE_START;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let trialsCompleted = 0;
  let correctCount = 0;
  let scorePosted = false;

  let roundDuration = 60.0;
  let timeRemaining = roundDuration;
  let lastTimestamp = 0;
  let isDemoMode = false;
  let botNextActTime = 0;

  // --- Random Dot Kinematogram (RDK) parameters ---
  const TOTAL_DOTS = 280;
  const dots = [];

  let currentDirection = 0;
  let currentCoherence = 0.70;
  let currentSpeed = 3.6;
  let trialStartTime = 0;

  // Feedback & Visuals
  let flashApertureColor = null;
  let flashApertureTime = 0;
  let floatingTexts = [];
  let ringEffects = [];

  class Dot {
    constructor() {
      this.respawn(true);
    }
    respawn(fullRandomLife = false) {
      // Pick uniform random point inside aperture
      const r = apertureRadius * Math.sqrt(Math.random());
      const theta = Math.random() * Math.PI * 2;
      this.x = r * Math.cos(theta);
      this.y = r * Math.sin(theta);
      this.life = fullRandomLife ? Math.floor(Math.random() * 45) : (35 + Math.floor(Math.random() * 25));
      this.size = 2.0 + Math.random() * 2.2;
      this.alpha = 0.35 + Math.random() * 0.65;
      this.coherent = Math.random() < currentCoherence;
      // random direction for noise dots
      this.noiseAngle = Math.random() * Math.PI * 2;
    }
    update(coherentDir, speed) {
      this.life--;
      if (this.life <= 0) {
        this.respawn(false);
        return;
      }

      if (this.coherent) {
        this.x += coherentDir.dx * speed;
        this.y += coherentDir.dy * speed;
      } else {
        this.x += Math.cos(this.noiseAngle) * speed;
        this.y += Math.sin(this.noiseAngle) * speed;
      }

      // Check distance from center
      const dist = Math.hypot(this.x, this.y);
      if (dist > apertureRadius) {
        // Re-enter from the opposite boundary or reseed
        if (this.coherent) {
          // Re-enter on the upstream edge to maintain continuous flow
          const backAngle = coherentDir.angle + Math.PI + (Math.random() - 0.5) * 1.5;
          this.x = apertureRadius * 0.98 * Math.cos(backAngle);
          this.y = apertureRadius * 0.98 * Math.sin(backAngle);
        } else {
          this.respawn(false);
        }
      }
    }
  }

  // Initialize dot pool
  for (let i = 0; i < TOTAL_DOTS; i++) {
    dots.push(new Dot());
  }

  function startNewTrial() {
    // Pick next direction randomly but prefer non-identical to keep dynamic
    let nextDir;
    do {
      nextDir = Math.floor(Math.random() * 4);
    } while (nextDir === currentDirection && Math.random() < 0.7);

    currentDirection = nextDir;
    trialStartTime = performance.now();

    // Adjust coherence & velocity dynamically
    // Coherence decreases from 70% down toward 16% as score climbs
    const progress = Math.min(1.0, score / 4500);
    currentCoherence = Math.max(0.16, 0.72 - progress * 0.54);
    currentSpeed = Math.min(8.5, 3.5 + progress * 4.2);

    // Reassign dot coherency flags smoothly
    dots.forEach(d => {
      d.coherent = Math.random() < currentCoherence;
      if (!d.coherent) {
        d.noiseAngle = Math.random() * Math.PI * 2;
      }
    });

    if (isDemoMode) {
      // Schedule autonomous bot action
      const reactionDelay = 220 + Math.random() * 280;
      botNextActTime = performance.now() + reactionDelay;
    }
  }

  function triggerResponse(dirId) {
    if (gameState !== STATE_PLAYING) return;

    const now = performance.now();
    const reactionTime = Math.max(80, now - trialStartTime);
    trialsCompleted++;

    if (dirId === currentDirection) {
      // Correct!
      correctCount++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;

      // Speed bonus: fastest responses earn up to +120 bonus points
      const speedBonus = Math.max(0, Math.floor((1200 - reactionTime) * 0.15));
      const basePoints = 100;
      const comboMultiplier = 1 + Math.min(10, combo - 1) * 0.15;
      const pointsEarned = Math.round((basePoints + speedBonus) * comboMultiplier);

      score += pointsEarned;
      soundSuccess(combo);

      flashApertureColor = 'rgba(52, 211, 153, 0.4)';
      flashApertureTime = now;

      floatingTexts.push({
        text: `+${pointsEarned}`,
        x: centerX + (Math.random() - 0.5) * 40,
        y: centerY - 25,
        alpha: 1.0,
        color: '#34d399',
        vy: -1.4
      });

      ringEffects.push({
        x: centerX,
        y: centerY,
        r: 10,
        dir: DIRS[dirId],
        alpha: 0.9,
        color: '#38bdf8'
      });

    } else {
      // Incorrect
      combo = 0;
      soundFail();
      flashApertureColor = 'rgba(239, 68, 68, 0.45)';
      flashApertureTime = now;

      floatingTexts.push({
        text: 'MISS',
        x: centerX,
        y: centerY - 20,
        alpha: 1.0,
        color: '#f87171',
        vy: -1.0
      });
    }

    startNewTrial();
  }

  function startRound(duration = 60.0, demo = false) {
    initAudio();
    gameState = STATE_PLAYING;
    roundDuration = duration;
    timeRemaining = duration;
    score = 0;
    combo = 0;
    maxCombo = 0;
    trialsCompleted = 0;
    correctCount = 0;
    scorePosted = false;
    isDemoMode = demo;
    floatingTexts = [];
    ringEffects = [];

    // Reset dots
    dots.forEach(d => d.respawn(true));
    startNewTrial();
  }

  function endRound() {
    gameState = STATE_GAMEOVER;
    timeRemaining = 0;
    if (uiTimer) uiTimer.textContent = '0.0s';
    if (uiScore) uiScore.textContent = score.toLocaleString();

    if (!scorePosted) {
      scorePosted = true;
      try {
        window.parent.postMessage({
          type: "brain-game-score",
          score: Math.round(score),
          target: "motion"
        }, "*");
      } catch (e) {}
    }
  }

  // --- Exposed Demo Runner (Mandatory Contract) ---
  window.startDemo = function() {
    startRound(25.0, true);
  };

  // --- Input Handlers ---
  function handleActionKey(code) {
    if (gameState === STATE_START) {
      startRound(60.0, false);
      return;
    }
    if (gameState === STATE_GAMEOVER) {
      startRound(60.0, false);
      return;
    }
    if (gameState === STATE_PLAYING) {
      for (const d of DIRS) {
        if (d.keys.includes(code)) {
          triggerResponse(d.id);
          break;
        }
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
      e.preventDefault();
    }
    handleActionKey(e.code);
  });

  // Mouse & Touch click interactions
  canvas.addEventListener('pointerdown', (e) => {
    initAudio();
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    if (gameState === STATE_START || gameState === STATE_GAMEOVER) {
      startRound(60.0, false);
      return;
    }

    if (gameState === STATE_PLAYING) {
      // Calculate angle relative to center to allow clicking on directional quarters
      const dx = px - centerX;
      const dy = py - centerY;
      const dist = Math.hypot(dx, dy);

      if (dist > 25) { // Avoid dead center
        let angle = Math.atan2(dy, dx); // [-PI, PI]
        if (angle < 0) angle += Math.PI * 2; // [0, 2PI]

        // 4 sectors: Right [7pi/4 to pi/4], Down [pi/4 to 3pi/4], Left [3pi/4 to 5pi/4], Up [5pi/4 to 7pi/4]
        if (angle >= 7 * Math.PI / 4 || angle < Math.PI / 4) {
          triggerResponse(0); // RIGHT
        } else if (angle >= Math.PI / 4 && angle < 3 * Math.PI / 4) {
          triggerResponse(1); // DOWN
        } else if (angle >= 3 * Math.PI / 4 && angle < 5 * Math.PI / 4) {
          triggerResponse(2); // LEFT
        } else {
          triggerResponse(3); // UP
        }
      }
    }
  });

  // --- Rendering Helpers ---
  function drawAperture() {
    ctx.save();

    // Subtle outer halo
    const glow = ctx.createRadialGradient(centerX, centerY, apertureRadius * 0.8, centerX, centerY, apertureRadius * 1.15);
    glow.addColorStop(0, 'rgba(14, 165, 233, 0.08)');
    glow.addColorStop(1, 'rgba(14, 165, 233, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(centerX, centerY, apertureRadius * 1.2, 0, Math.PI * 2);
    ctx.fill();

    // Aperture Circle Fill (Dark chamber)
    ctx.beginPath();
    ctx.arc(centerX, centerY, apertureRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#050914';
    ctx.fill();

    // Feedback Flash on border
    const now = performance.now();
    if (flashApertureColor && now - flashApertureTime < 240) {
      const p = 1.0 - (now - flashApertureTime) / 240;
      ctx.lineWidth = 4 + p * 6;
      ctx.strokeStyle = flashApertureColor;
    } else {
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#1e293b';
    }
    ctx.stroke();

    // Direction Guide Glyphs (Light up or stay subtle)
    const arrowDist = apertureRadius + 32;
    const arrowLabels = [
      { glyph: '▶', x: centerX + arrowDist, y: centerY },
      { glyph: '▼', x: centerX, y: centerY + arrowDist + 4 },
      { glyph: '◀', x: centerX - arrowDist, y: centerY },
      { glyph: '▲', x: centerX, y: centerY - arrowDist - 2 }
    ];

    ctx.font = '600 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    arrowLabels.forEach((al, i) => {
      ctx.fillStyle = '#475569';
      ctx.fillText(al.glyph, al.x, al.y);
    });

    // Central Fixation Crosshair
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(centerX - 10, centerY);
    ctx.lineTo(centerX + 10, centerY);
    ctx.moveTo(centerX, centerY - 10);
    ctx.lineTo(centerX, centerY + 10);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#38bdf8';
    ctx.fill();

    ctx.restore();
  }

  function renderDots() {
    ctx.save();
    // Clip dots strictly inside aperture
    ctx.beginPath();
    ctx.arc(centerX, centerY, apertureRadius - 2, 0, Math.PI * 2);
    ctx.clip();

    const dir = DIRS[currentDirection];
    const n = dots.length;
    for (let i = 0; i < n; i++) {
      const d = dots[i];
      if (gameState === STATE_PLAYING) {
        d.update(dir, currentSpeed);
      }

      const screenX = centerX + d.x;
      const screenY = centerY + d.y;

      ctx.beginPath();
      ctx.arc(screenX, screenY, d.size, 0, Math.PI * 2);

      if (d.coherent) {
        // High contrast crisp white-blue for coherent motion signal
        ctx.fillStyle = `rgba(240, 249, 255, ${d.alpha})`;
      } else {
        // Noise dots
        ctx.fillStyle = `rgba(148, 163, 184, ${d.alpha * 0.8})`;
      }
      ctx.fill();
    }
    ctx.restore();
  }

  function renderRings() {
    ctx.save();
    for (let i = ringEffects.length - 1; i >= 0; i--) {
      const r = ringEffects[i];
      r.r += 4.5;
      r.x += r.dir.dx * 1.5;
      r.y += r.dir.dy * 1.5;
      r.alpha -= 0.035;

      if (r.alpha <= 0 || r.r > apertureRadius) {
        ringEffects.splice(i, 1);
        continue;
      }

      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = `rgba(56, 189, 248, ${r.alpha})`;
      ctx.stroke();
    }
    ctx.restore();
  }

  function renderFloatingTexts() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 22px sans-serif';

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy;
      ft.alpha -= 0.03;

      if (ft.alpha <= 0) {
        floatingTexts.splice(i, 1);
        continue;
      }

      ctx.globalAlpha = Math.max(0, ft.alpha);
      ctx.fillStyle = ft.color;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
      ctx.shadowBlur = 6;
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.restore();
  }

  function renderHUD() {
    // Current Combo & Coherence Indicator during gameplay
    if (gameState === STATE_PLAYING) {
      ctx.save();
      // Combo Badge below aperture
      if (combo > 1) {
        ctx.font = '700 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = combo >= 5 ? '#f59e0b' : '#38bdf8';
        ctx.fillText(`STREAK x${combo}`, centerX, centerY + apertureRadius + 60);
      }

      // Live Coherence Level meter (subtle neural readout)
      ctx.font = '500 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#64748b';
      const pct = Math.round(currentCoherence * 100);
      ctx.fillText(`SIGNAL COHERENCE: ${pct}%  |  SPEED: ${currentSpeed.toFixed(1)}px/f`, centerX, centerY - apertureRadius - 40);

      // Arrow Key Prompt reminder at bottom
      ctx.font = '500 13px sans-serif';
      ctx.fillStyle = '#475569';
      ctx.fillText('IDENTIFY NET FLOW DIRECTION  [ ↑ / ↓ / ← / → ]  OR  [ W / A / S / D ]', centerX, height - 24);
      ctx.restore();
    }
  }

  function renderStartScreen() {
    ctx.save();
    ctx.fillStyle = 'rgba(6, 11, 22, 0.88)';
    ctx.fillRect(0, 0, width, height);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Title & Icon
    ctx.font = '700 32px sans-serif';
    ctx.fillStyle = '#38bdf8';
    ctx.shadowColor = 'rgba(56, 189, 248, 0.4)';
    ctx.shadowBlur = 14;
    ctx.fillText('COHERENT FLOW RUNNER', centerX, centerY - 130);
    ctx.shadowBlur = 0;

    ctx.font = '600 14px sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('NEUROPHYSIOLOGICAL RANDOM DOT KINEMATOGRAM (MT+/V5)', centerX, centerY - 95);

    // Box instructions
    const boxW = Math.min(width - 40, 520);
    const boxH = 145;
    const boxX = centerX - boxW / 2;
    const boxY = centerY - 55;

    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(boxX, boxY, boxW, boxH, 12) : ctx.rect(boxX, boxY, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    ctx.font = '400 15px sans-serif';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText('A fraction of dynamic dots drifts coherently in one of 4 cardinal directions.', centerX, boxY + 36);
    ctx.fillText('The rest is visual noise. As score rises, coherence drops towards 16%.', centerX, boxY + 64);
    ctx.fillText('React rapidly to net flow: use ARROW KEYS, WASD, or click.', centerX, boxY + 92);

    ctx.font = '600 13px sans-serif';
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('60 SECONDS RAPID-FIRE PERCEPTUAL TRIAL', centerX, boxY + 120);

    // Call to Action
    const pulse = 0.8 + 0.2 * Math.sin(performance.now() * 0.005);
    ctx.globalAlpha = pulse;
    ctx.font = '700 18px sans-serif';
    ctx.fillStyle = '#34d399';
    ctx.fillText('CLICK OR PRESS ANY KEY TO START', centerX, centerY + 135);
    ctx.restore();
  }

  function renderGameOverScreen() {
    ctx.save();
    ctx.fillStyle = 'rgba(6, 11, 22, 0.90)';
    ctx.fillRect(0, 0, width, height);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = '700 30px sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText('TRIAL COMPLETE', centerX, centerY - 130);

    const boxW = Math.min(width - 40, 480);
    const boxH = 180;
    const boxX = centerX - boxW / 2;
    const boxY = centerY - 90;

    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(boxX, boxY, boxW, boxH, 12) : ctx.rect(boxX, boxY, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    ctx.font = '500 14px sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('FINAL SCORE', centerX, boxY + 32);

    ctx.font = '700 42px sans-serif';
    ctx.fillStyle = '#34d399';
    ctx.fillText(score.toLocaleString(), centerX, boxY + 70);

    const accuracy = trialsCompleted > 0 ? Math.round((correctCount / trialsCompleted) * 100) : 0;
    ctx.font = '500 14px sans-serif';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(`Trials: ${trialsCompleted}   |   Accuracy: ${accuracy}%   |   Max Streak: ${maxCombo}`, centerX, boxY + 115);

    ctx.font = '600 12px sans-serif';
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('MT+/V5 Motion Integration Cortex Activated', centerX, boxY + 145);

    // Play again prompt
    const pulse = 0.8 + 0.2 * Math.sin(performance.now() * 0.005);
    ctx.globalAlpha = pulse;
    ctx.font = '700 18px sans-serif';
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('CLICK OR PRESS ANY KEY TO PLAY AGAIN', centerX, centerY + 130);
    ctx.restore();
  }

  // --- Main Animation Loop ---
  function loop(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = Math.min(0.1, (timestamp - lastTimestamp) / 1000);
    lastTimestamp = timestamp;

    // Update timers
    if (gameState === STATE_PLAYING) {
      timeRemaining -= dt;
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        endRound();
      } else {
        if (uiTimer) uiTimer.textContent = timeRemaining.toFixed(1) + 's';
        if (uiScore) uiScore.textContent = score.toLocaleString();
      }

      // Automated Bot Logic for startDemo()
      if (isDemoMode && timestamp >= botNextActTime && gameState === STATE_PLAYING) {
        // High accuracy bot with occasional human-like error (~92% correct)
        const willHit = Math.random() < 0.92;
        if (willHit) {
          triggerResponse(currentDirection);
        } else {
          triggerResponse((currentDirection + 1 + Math.floor(Math.random() * 3)) % 4);
        }
      }
    }

    // Render Canvas
    ctx.clearRect(0, 0, width, height);

    drawAperture();
    renderDots();
    renderRings();
    renderFloatingTexts();
    renderHUD();

    if (gameState === STATE_START) {
      renderStartScreen();
    } else if (gameState === STATE_GAMEOVER) {
      renderGameOverScreen();
    }

    requestAnimationFrame(loop);
  }

  // Initial layout and start loop
  resize();
  requestAnimationFrame(loop);

})();
</script>

</html>
